version: "3.8"

services:
  web:
    build: .
    container_name: nonghubao-web
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2:latest
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge
      - ./model:/app/model
    restart: unless-stopped

